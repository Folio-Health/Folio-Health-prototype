<!-- ===== Folio · favicon + app icons ===== -->
<!-- Place these in <head>. Assumes files live at /assets/ -->

<!-- Modern browsers: scalable SVG favicon (crispest) -->
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

<!-- Fallback .ico (16/32/48) for legacy + Windows -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">

<!-- Explicit PNG fallbacks -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">

<!-- iOS / iPadOS home-screen icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

<!-- PWA manifest + theme -->
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#0E443B">
<meta name="apple-mobile-web-app-title" content="Folio">

<!-- Social / link previews (Open Graph + Twitter) -->
<meta property="og:title" content="Folio — the record that follows the patient">
<meta property="og:description" content="One record, every clinic. A connecting layer for Nigerian healthcare.">
<meta property="og:image" content="/assets/folio-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/assets/folio-og.png">
